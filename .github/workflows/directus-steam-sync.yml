name: Directus Steam Sync CI/CD
on:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: moonrepo/setup-toolchain@v0
      - run: moon run directus-steam-sync:install
      - run: moon run directus-steam-sync:format-check
      # - run: moon run directus-steam-sync:lint
      - run: cd scripts/directus-steam-sync && pnpm start --help
