name: Satchel CI/CD
on:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - run: pnpm install
      - run: pnpm run format-check
      # - run: pnpm run lint
      - run: pnpm start --help
